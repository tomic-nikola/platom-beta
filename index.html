      commit(); break;
    }
    case 'del-area': e.stopPropagation(); withUndo(t('Obrisan projekat: {n}', { n: area.name }), () => { cat.areas = cat.areas.filter(a => a !== area); }); break;
    case 'day-add': if (!e.target.closest('.ev')) addChooser(d.date); break;
    case 'cal-prev': calCursor.setMonth(calCursor.getMonth() - 1); renderView(false, 'prev'); break;
    case 'cal-next': calCursor.setMonth(calCursor.getMonth() + 1); renderView(false, 'next'); break;
    case 'cal-today': { const n = new Date(); n.setDate(1); const dir = n < calCursor ? 'prev' : n > calCursor ? 'next' : ''; calCursor = n; renderView(!dir, dir); break; }
    case 'add-vac': vacationDialog(null); break;
    case 'edit-vac': vacationDialog(state.vacations.find(x => x.id === d.vac)); break;
    case 'del-vac': { const v = state.vacations.find(x => x.id === d.vac); withUndo(t('Odmor obrisan'), () => { state.vacations = state.vacations.filter(x => x !== v); }); break; }
    case 'add-bill': billDialog(null, cat); break;
    case 'edit-bill': { const bl = findBill(d.cat, d.bill); if (bl) billDialog(bl, cat); break; }
    case 'del-bill': { const bl = findBill(d.cat, d.bill); withUndo(t('Obrisan račun: {n}', { n: bl.name }), () => { cat.bills = cat.bills.filter(x => x !== bl); }); break; }
    case 'pay': {
      e.stopPropagation();
      const bl = findBill(d.cat, d.bill); if (!bl) break;
      const li = b.closest('.ritem');
      if (!bl.paid[d.date] && li) { b.classList.add('on'); li.classList.add('checked'); await sleep(REDUCED ? 0 : 380); li.classList.add('gone'); await sleep(REDUCED ? 0 : 240); }
      togglePaid(bl, d.date); break;
    }
    case 'shop-toggle': {
      if (e.target.closest('.mini')) break;
      const { i, l } = findShop({ cat: d.cat, list: d.list, item: d.item }); if (!i) break;
      if (!i.done) { b.classList.add('bought'); b.querySelector('.tick').classList.add('on'); await sleep(REDUCED ? 0 : 200); b.classList.add('gone'); await sleep(REDUCED ? 0 : 200); }
        i.done = !i.done; if (i.done) i.doneAt = todayStr(); else delete i.doneAt; lastMoved = i.id; setTimeout(() => { if (lastMoved === i.id) lastMoved = null; }, 600);
        if (!i.done) l.items = [...l.items.filter(x => x !== i), i];
      commit(); break;
    }
    case 'shop-del': { e.stopPropagation(); const { l, i } = findShop({ cat: d.cat, list: d.list, item: d.item }); withUndo(t('Uklonjeno: {n}', { n: i.text }), () => { l.items = l.items.filter(x => x !== i); }); break; }
    case 'shop-due': { e.stopPropagation(); const { i } = findShop({ cat: d.cat, list: d.list, item: d.item }); openDP(b, i.due, (v) => { i.due = v; commit(); }); break; }
    case 'shop-clear': { const { l } = findShop({ cat: d.cat, list: d.list }); withUndo(t('Očišćeno'), () => { l.items = l.items.filter(x => !x.done); }); break; }
    case 'list-due': { const { l } = findShop({ cat: d.cat, list: d.list }); openDP(b, l.due, (v) => { l.due = v; commit(); }); break; }
    case 'list-edit': {
      const { l } = findShop({ cat: d.cat, list: d.list });
      const v = await ask({ title: t('Izmeni listu'), fields: [{ name: 'name', label: t('Naziv'), value: l.name, required: true }, { name: 'due', label: t('Rok (opciono)'), type: 'date', value: l.due, placeholder: t('Bez roka') }] });
      if (v && v.name) { l.name = v.name; l.due = v.due || ''; commit(); }
      break;
    }
    case 'list-del': { const { c, l } = findShop({ cat: d.cat, list: d.list }); withUndo(t('Obrisana lista: {n}', { n: l.name }), () => { c.lists = c.lists.filter(x => x !== l); }); break; }
    // knjige
    case 'add-book': bookDialog(null, cat, d.status || 'want'); break;
    case 'goal': goalDialog(cat); break;
    case 'edit-book': { const { c, b: bk } = findBook(d.book); if (bk) bookDialog(bk, c); break; }
    case 'del-book': { const { c, b: bk } = findBook(d.book); withUndo(t('Obrisano: {n}', { n: bk.title }), () => { c.books = c.books.filter(x => x !== bk); }); break; }
    case 'start-book': { const { c, b: bk } = findBook(d.book); bk.status = 'reading'; bk.started = todayStr(); c.books = [...c.books.filter(x => x !== bk), bk]; commit(); toast(t('Srećno čitanje: {n}', { n: bk.title })); break; }
    case 'finish-book': {
      const { b: bk } = findBook(d.book);
      const prev = { status: bk.status, finished: bk.finished, page: bk.page };
      bk.status = 'done'; bk.finished = todayStr(); if (bk.pages) bk.page = bk.pages;
      commit();
      const g = readingGoal(thisYear());
      toast(g ? t('Pročitano! {a} od {b} za {y}.', { a: readIn(thisYear()), b: g.goal, y: thisYear() }) : t('Pročitano: {n}', { n: bk.title }), () => { Object.assign(bk, prev); commit(); });
      break;
    }
    case 'book-up': { const { c, b: bk } = findBook(d.book); const w = booksOf(c, 'want'), i = w.indexOf(bk); if (i > 0) { const other = w[i - 1]; const ia = c.books.indexOf(bk), ib = c.books.indexOf(other); c.books[ia] = other; c.books[ib] = bk; commit(); } break; }
    case 'rate': { const { b: bk } = findBook(d.book); const n = +d.n; bk.rating = bk.rating === n ? 0 : n; commit(); break; }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.pref === 'crossPast') { prefs.crossPast = el.checked; savePrefs(); $('.cal-box')?.classList.toggle('xpast', el.checked); return; }
  if (el.dataset.page) {
    const { b: bk } = findBook(el.dataset.page); if (!bk) return;
      setPage(bk, parseInt(el.value, 10) || 0);
    if (bk.pages && bk.page >= bk.pages) { toast(t('Stigao si do kraja – označi „Pročitao sam“.')); }
    commit();
  }
});

document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (el.matches && el.matches('[data-page]') && e.key === 'Enter') { el.blur(); return; }
  if (el.matches && el.matches('[data-book-add]')) {
    if (e.key !== 'Enter' || !el.value.trim()) return;
    e.preventDefault();
    const c = catById(el.dataset.bookAdd), { title, author } = parseBook(el.value);
    c.books.push({ id: uid(), title, author, pages: 0, page: 0, status: 'want', added: todayStr(), started: '', finished: '', rating: 0 });
    commit(); $(`[data-book-add="${c.id}"]`)?.focus();
    return;
  }
    if (el.matches && el.matches('.ci-quick')) {
      if (e.key !== 'Enter' || !el.value.trim()) return;
      e.preventDefault();
      const c = catById(el.dataset.cat); const { title, deadline } = parseQuick(el.value);
      c.items.push({ id: uid(), title, due: c.fields.due ? deadline : '', amount: '', note: '', prog: '', target: '', done: false, created: Date.now() });
      commit(); $(`.ci-quick[data-cat="${c.id}"]`)?.focus(); return;
    }
    if (el.matches && el.matches('[data-shop-add]')) {
    if (e.key === 'Escape') { el.value = ''; el.blur(); return; }
    if (e.key !== 'Enter' || !el.value.trim()) return;
    e.preventDefault();
    const c = catById(el.dataset.shopCat), l = c && c.lists.find(x => x.id === el.dataset.shopAdd); if (!l) return;
    addShopItem(c, l, el.value);
    commit(); $(`[data-shop-add="${l.id}"]`)?.focus();
    return;
  }
  if (el.matches && el.matches('.quick-input')) {
    if (e.key === 'Escape') { el.value = ''; el.blur(); return; }
    if (e.key !== 'Enter' || !el.value.trim()) return;
    e.preventDefault();
    const area = allAreas().find(x => x.area.id === el.dataset.quickArea)?.area; if (!area) return;
    const { title, deadline } = parseQuick(el.value);
    const card = createCard(area, title, deadline);
    commit();
    $(`[data-quick-area="${area.id}"]`)?.focus();
    const c = $(`.card[data-card="${card.id}"]`); if (c && !REDUCED) c.classList.add('enter');
    toast(deadline ? `${t('Dodato')} · ${fmtLong(deadline)}` : t('Dodato'));
    return;
  }
  if (el.matches && (el.matches('.card') || el.matches('.ccard') || el.matches('.gcard') || el.matches('.subrow') || el.matches('.hcard2') && false || el.matches('.hcard2') || el.matches('.brand')) && e.key === 'Enter') { el.click(); return; }
  if (e.key === 'Escape') {
    if (closePop()) return;
    if (closeDP()) return;
    if (closeModal()) return;
    if (closeDrawer()) return;
    if (document.body.classList.contains('side-open')) { document.body.classList.remove('side-open'); return; }
    if (query || $('#tb-search.open')) { clearSearch(); $('#tb-search')?.classList.remove('open'); renderView(true); $('#search').blur(); return; }
    return;
  }
  const typing = el.closest && el.closest('input, textarea, select, [contenteditable]');
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $('#modal-root .modal-back') || $('#app').hidden) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); closeDrawer(); if (view === 'tasks') addHere(); else addChooser(); }
  else if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (k === 't') toggleTheme();
    else if (['1', '2', '3'].includes(k) && !drawerId) setView(prefs.tabOrder[+k - 1]);
    else if (e.key === 'ArrowRight') goView(1);
    else if (e.key === 'ArrowLeft') goView(-1);
});

let searchT;
$('#search').addEventListener('blur', () => setTimeout(closeSearch, 150));
$('#search').addEventListener('input', (e) => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { query = e.target.value.trim(); renderView(false); }, 110);
});

document.addEventListener('submit', (e) => {
  const f = e.target; if (f.dataset.form !== 'vac') return;
  e.preventDefault();
  let from = f.querySelector('input[name=from]').value, to = f.querySelector('input[name=to]').value || from;
  if (!from) { toast(t('Izaberi datume od i do')); f.querySelector('[data-dfield="from"]').click(); return; }
  if (to < from) [from, to] = [to, from];
  const catId = f.dataset.cat || ensureType('vacation').id;
  state.vacations.push({ id: uid(), from, to, note: f.querySelector('input[name=note]').value.trim(), catId });
  if (view === 'calendar') { const tg = parseYmd(from); tg.setDate(1); calCursor = tg; }
  commit();
  toast(`${t('Odmor dodat')} · ${nW(workdays(from, to), 'radni')}`);
});

addEventListener('resize', () => moveInd());

/* ===================== SWIPE: Fokus ← Platom → Kalendar ===================== */
function goView(step) {
  const VIEWS = prefs.tabOrder;
  const i = VIEWS.indexOf(view), j = i + step; if (j < 0 || j > 2) return;
  if ($('#modal-root .modal-back') || drawerId || $('.pop') || dp.el) return;
  navSlide = step > 0 ? 'fwd' : 'back';
  if (VIEWS[j] === 'tasks') { sel = { type: 'root' }; }
  setView(VIEWS[j]);
}
let navSlide = '';
const noSwipe = (el) => el && el.closest && el.closest('input, textarea, select, .up-row, .mini-seg, .dp, .modal, .drawer, .sidebar, [data-sort].sorting, .tb-search, .swipe-wrap');
let sw = null;
document.addEventListener('touchstart', (e) => { if (e.touches.length !== 1 || noSwipe(e.target)) { sw = null; return; } const p = e.touches[0]; sw = { x: p.clientX, y: p.clientY, t: Date.now() }; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!sw || drag.active) { sw = null; return; }
  const p = e.changedTouches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  if (dt < 700 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) goView(dx < 0 ? 1 : -1);
}, { passive: true });
let wAcc = 0, wLock = 0;
addEventListener('wheel', (e) => {
  const sww = e.target.closest && e.target.closest('.swipe-wrap');
  if (sww && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    sww._acc = (sww._acc || 0) + e.deltaX; clearTimeout(sww._t); sww._t = setTimeout(() => { sww._acc = 0; }, 220);
    if (sww._acc > 40 && !sww.classList.contains('open')) { swOpen(sww); sww._acc = 0; }
    else if (sww._acc < -40 && sww.classList.contains('open')) { sww.classList.remove('open'); swSet(sww, 0, true); sww._acc = 0; }
    return;
  }
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.5 || noSwipe(e.target)) return;
  if (Date.now() < wLock) return;
  wAcc += e.deltaX; clearTimeout(wAcc._t);
  if (Math.abs(wAcc) > 140) { goView(wAcc > 0 ? 1 : -1); wAcc = 0; wLock = Date.now() + 700; }
  setTimeout(() => { wAcc = 0; }, 250);
}, { passive: true });

function applyTabOrder() { const nav = $('#tabs'); prefs.tabOrder.forEach(v => { const b = nav.querySelector(`[data-view="${v}"]`); if (b) nav.appendChild(b); }); }
/* ===================== POKRETANJE ===================== */
function startApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  buildClock();
  applyTabOrder();
  $$('.seg-btn').forEach(x => x.classList.toggle('active', x.dataset.view === view));
  applyStatic(); applyColor(); applyBar(); applyDate(); applyAlign();
  const ind = $('.seg-ind'); ind.style.transition = 'none';
  moveInd(); requestAnimationFrame(() => { ind.style.transition = ''; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  renderView(true);
  scheduleSave(0);
  let lastDay = todayStr();
  setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); renderView(false); } }, 60000);
}
(async function init() {
  if (!SYNC) { loadLocal(); startApp(); return; }
  const msg = sessionStorage.getItem('planer-msg'); sessionStorage.removeItem('planer-msg');
  if (!msg) { try { if (await tryRemembered()) { startApp(); return; } } catch { localStorage.removeItem('planer-key'); } }
  const form = $('#login-form'), pass = $('#login-pass'), out = $('#login-msg'), btn = $('#login-btn');
  $('#login').hidden = false; $('#login-user').value = LOGIN_EMAIL;
  out.textContent = msg || t('Novi uređaj – šifra se unosi samo jednom.');
  pass.focus();
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); btn.disabled = true;
    try { await pairDevice(pass.value); pass.value = ''; startApp(); }
    catch (err) { out.textContent = t('Pogrešna šifra ili nema veze.'); if (store.unsub) store.unsub(); store.blocked = false; btn.disabled = false; pass.select(); }
  });
})();
})();

</script>
